name: Make Preview Clips

on:
  push:
    paths:
      - "manual/preview_task.json"

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Create lightweight previews
        run: |
          mkdir -p manual/previews
          python - <<'PY' > /tmp/names.txt
          import json
          from pathlib import Path
          d=json.loads(Path("manual/preview_task.json").read_text())
          for n in d["clips"]: print(n)
          PY
          while read -r n; do
            ffmpeg -y -loglevel error -i "manual/output/$n.mp4" \
              -vf "scale=540:960:force_original_aspect_ratio=decrease,pad=540:960:(ow-iw)/2:(oh-ih)/2" \
              -c:v libx264 -preset ultrafast -crf 34 -r 30 \
              -c:a aac -b:a 80k -movflags +faststart \
              "manual/previews/${n}_preview.mp4" &
          done < /tmp/names.txt
          wait
      - name: Create review page
        run: |
          python - <<'PY'
          import json, html
          from pathlib import Path
          d=json.loads(Path("manual/preview_task.json").read_text())
          titles=d.get("titles",{})
          cards=[]
          for i,n in enumerate(d["clips"],1):
              title=html.escape(titles.get(n,f"Clip {i}"))
              src=html.escape(f"previews/{n}_preview.mp4")
              cards.append(f'<div class="card"><h2>{i}. {title}</h2><video controls preload="metadata" playsinline src="{src}"></video></div>')
          page='''<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Varez - Revisión rápida</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#111;color:#fff;margin:0;padding:18px}h1{font-size:24px;margin:0 0 6px}.sub{color:#aaa;margin-bottom:18px}.card{background:#1b1b1b;border-radius:16px;padding:14px;margin:0 0 18px}video{width:100%;max-height:75vh;border-radius:12px;background:#000}h2{font-size:18px;margin:0 0 10px}</style></head><body><h1>Varez · Revisión rápida</h1><div class="sub">Previews livianos de los clips seleccionados</div>'''+''.join(cards)+'''</body></html>'''
          Path("manual/review.html").write_text(page,encoding="utf-8")
          PY
      - name: Publish previews
        run: |
          git config user.name "Varez Worker"
          git config user.email "actions@users.noreply.github.com"
          git stash push -u -m "varez-previews" || true
          git pull --rebase origin main
          git stash pop || true
          git add manual/previews manual/review.html
          git commit -m "Add FM Ciudad lightweight previews" || exit 0
          git pull --rebase origin main
          git push
