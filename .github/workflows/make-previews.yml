name: Make Preview Clips

on:
  push:
    paths:
      - "manual/preview_task.json"

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Create lightweight previews
        run: |
          mkdir -p manual/previews
          for f in manual/output/Nati_Clip_02_v2.mp4 manual/output/Nati_Clip_03_v2.mp4 manual/output/Nati_Clip_04_v2.mp4 manual/output/Nati_Clip_05_v2.mp4 manual/output/Nati_Clip_06_v2.mp4; do
            n=$(basename "$f" .mp4)
            ffmpeg -y -loglevel error -i "$f" \
              -vf "scale=540:960:force_original_aspect_ratio=decrease,pad=540:960:(ow-iw)/2:(oh-ih)/2" \
              -c:v libx264 -preset ultrafast -crf 34 -r 30 \
              -c:a aac -b:a 80k -movflags +faststart \
              "manual/previews/${n}_preview.mp4" &
          done
          wait
      - name: Create review page
        run: |
          cat > manual/review.html <<'HTML'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Varez - Revisión rápida</title>
            <style>
              body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#111;color:#fff;margin:0;padding:18px}
              h1{font-size:24px;margin:0 0 6px}.sub{color:#aaa;margin-bottom:18px}
              .card{background:#1b1b1b;border-radius:16px;padding:14px;margin:0 0 18px}
              video{width:100%;max-height:75vh;border-radius:12px;background:#000}
              h2{font-size:18px;margin:0 0 10px}
            </style>
          </head>
          <body>
            <h1>Varez · Revisión rápida</h1>
            <div class="sub">Previews livianos de los 5 clips de Nati</div>
            <div class="card"><h2>Clip 2</h2><video controls preload="metadata" playsinline src="previews/Nati_Clip_02_v2_preview.mp4"></video></div>
            <div class="card"><h2>Clip 3</h2><video controls preload="metadata" playsinline src="previews/Nati_Clip_03_v2_preview.mp4"></video></div>
            <div class="card"><h2>Clip 4</h2><video controls preload="metadata" playsinline src="previews/Nati_Clip_04_v2_preview.mp4"></video></div>
            <div class="card"><h2>Clip 5</h2><video controls preload="metadata" playsinline src="previews/Nati_Clip_05_v2_preview.mp4"></video></div>
            <div class="card"><h2>Clip 6</h2><video controls preload="metadata" playsinline src="previews/Nati_Clip_06_v2_preview.mp4"></video></div>
          </body>
          </html>
          HTML
      - name: Publish previews
        run: |
          git config user.name "Varez Worker"
          git config user.email "actions@users.noreply.github.com"
          git add manual/previews manual/review.html
          git commit -m "Add lightweight clip previews" || exit 0
          git pull --rebase origin main
          git push
