name: Manual Varez Render

on:
  push:
    paths:
      - "manual/render_task.json"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install gdown requests
      - name: Render clip
        run: python worker/manual_render.py
      - name: Save result link
        run: |
          git config user.name "Varez Worker"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase
          git add manual/render_result.json
          git commit -m "Add manual render result" || exit 0
          git push
