name: Manual Varez Render

on:
  push:
    paths:
      - "manual/render_task.json"

permissions:
  contents: write

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        clip_index: [0,1,2,3,4]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install gdown faster-whisper
      - name: Render Varez clip
        env:
          CLIP_INDEX: ${{ matrix.clip_index }}
        run: python worker/manual_render.py
      - name: Upload rendered clip
        uses: actions/upload-artifact@v4
        with:
          name: vclip-${{ matrix.clip_index }}
          path: manual/output/*.mp4
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: vclip-*
          path: manual/output
          merge-multiple: true
      - name: Publish clips
        run: |
          git config user.name "Varez Worker"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          git add manual/output/*.mp4
          git commit -m "Render Nati Varez clip batch" || exit 0
          git pull --rebase origin main
          git push
