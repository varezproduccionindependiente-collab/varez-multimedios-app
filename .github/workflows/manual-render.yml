name: Manual Varez Render

on:
  push:
    paths:
      - "manual/render_task.json"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install gdown faster-whisper
      - name: Render Varez clip
        run: python worker/manual_render.py
      - name: Publish clip
        run: |
          git config user.name "Varez Worker"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          git add manual/output/Nati_Clip_02_v2.mp4 manual/output/Nati_Clip_03_v2.mp4 manual/output/Nati_Clip_04_v2.mp4 manual/output/Nati_Clip_05_v2.mp4 manual/output/Nati_Clip_06_v2.mp4
          git commit -m "Render five Nati Varez clips" || exit 0
          git pull --rebase origin main
          git push
