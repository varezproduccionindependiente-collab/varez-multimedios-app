name: Recover Last Varez Render

on:
  push:
    paths:
      - '.github/workflows/recover-render.yml'
  workflow_dispatch:
    inputs:
      release_id:
        description: "Draft release id"
        required: true
        type: string
      job_id:
        description: "Previous Varez job id"
        required: true
        type: string

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade requests
      - name: Copy rendered MP4s to Supabase
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python worker/recover.py --release-id "${{ inputs.release_id || '391909862' }}" --job-id "${{ inputs.job_id || '936968b13c1c4fe5' }}"
