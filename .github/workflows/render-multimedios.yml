name: Render Varez Multimedios

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: "Signed manifest URL"
        required: true
        type: string
      job_id:
        description: "Varez job id"
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade requests
      - name: Render five clips
        run: |
          python worker/render.py --manifest-url "${{ inputs.manifest_url }}" --job-id "${{ inputs.job_id }}"
